<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 960" fill="none">
  <defs>
    <radialGradient id="glow1" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="50%" stop-color="#A1A1AA" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="800" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#151519"/>
      <stop offset="50%" stop-color="#0D0D10"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="metalBorder" x1="0" y1="0" x2="800" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#A1A1AA" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.22"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="960" fill="url(#cardGrad)"/>
  <rect width="800" height="960" fill="url(#grid)"/>
  <circle cx="400" cy="340" r="360" fill="url(#glow1)"/>

  <!-- Digital Identity Pass Frame -->
  <rect x="80" y="70" width="640" height="820" rx="24" fill="#0A0A0D" fill-opacity="0.82" stroke="url(#metalBorder)" stroke-width="1.5"/>
  <rect x="104" y="94" width="592" height="772" rx="16" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>

