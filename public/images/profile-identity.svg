    <rect x="148" y="806" width="1.5" height="24"/>
    <rect x="155" y="806" width="6" height="24"/>
    <rect x="166" y="806" width="2" height="24"/>
    <rect x="174" y="806" width="4" height="24"/>
    <rect x="184" y="806" width="1.5" height="24"/>
    <rect x="190" y="806" width="8" height="24"/>
    <rect x="204" y="806" width="2" height="24"/>
    <rect x="212" y="806" width="5" height="24"/>
    <rect x="222" y="806" width="1.5" height="24"/>
    <rect x="228" y="806" width="3" height="24"/>
