  <text x="140" y="704" fill="#92929B" font-family="monospace" font-size="12" letter-spacing="3">DIGITAL IDENTITY PASS</text>
  <text x="140" y="742" fill="#F5F5F7" font-family="sans-serif" font-weight="700" font-size="28" letter-spacing="1">KYYMIDNIGHT</text>
  <text x="140" y="774" fill="#A1A1AA" font-family="monospace" font-size="14" letter-spacing="1.5">UI/UX ARCHITECT &amp; CREATIVE DEVELOPER</text>

