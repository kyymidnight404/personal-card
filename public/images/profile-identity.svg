  <circle cx="148" cy="138" r="6" fill="#F5F5F7" fill-opacity="0.8"/>
  <circle cx="170" cy="138" r="6" fill="#92929B" fill-opacity="0.35"/>
  <text x="530" y="143" fill="#92929B" font-family="monospace" font-size="13" letter-spacing="3">ID // KM-001</text>
  <line x1="104" y1="176" x2="696" y2="176" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <!-- Center Geometric Monogram Sculpture -->
  <circle cx="400" cy="410" r="156" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1" stroke-dasharray="4 6"/>
  <circle cx="400" cy="410" r="120" stroke="url(#metalBorder)" stroke-width="1.5"/>
  <circle cx="400" cy="410" r="82" fill="#121217" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1"/>

  <!-- K M Monogram Geometry -->
  <path d="M356 368V452M356 410L396 368M372 394L402 452" stroke="#F5F5F7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M412 452V368L434 412L456 368V452" stroke="#A1A1AA" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Crosshair Accents -->
  <path d="M400 220V244M400 576V600M210 410H234M566 410H590" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="1.2"/>

  <!-- Pass Metadata Footer -->
