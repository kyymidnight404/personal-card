  <!-- Left Sidebar -->
  <rect x="142" y="178" width="220" height="498" rx="12" fill="#151519" fill-opacity="0.7" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <rect x="166" y="206" width="120" height="10" rx="5" fill="#F5F5F7" fill-opacity="0.7"/>
  <rect x="166" y="238" width="172" height="32" rx="6" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.14"/>
  <rect x="166" y="284" width="172" height="32" rx="6" fill="#FFFFFF" fill-opacity="0.02"/>
  <rect x="166" y="330" width="172" height="32" rx="6" fill="#FFFFFF" fill-opacity="0.02"/>
  <rect x="166" y="376" width="172" height="32" rx="6" fill="#FFFFFF" fill-opacity="0.02"/>

  <!-- Central Viewport Metric Cards -->
  <rect x="390" y="178" width="420" height="240" rx="14" fill="#151519" fill-opacity="0.85" stroke="url(#obsStroke)" stroke-width="1.2"/>
  <path d="M422 366 C480 350, 510 260, 570 280 C630 300, 670 210, 774 224" stroke="#F5F5F7" stroke-width="2.5" fill="none"/>
  <path d="M422 384 C490 370, 540 320, 610 330 C680 340, 720 275, 774 285" stroke="#92929B" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <circle cx="570" cy="280" r="5" fill="#F5F5F7"/>
  <circle cx="774" cy="224" r="5" fill="#F5F5F7"/>
  <text x="422" y="216" fill="#92929B" font-family="monospace" font-size="11" letter-spacing="2">TELEMETRY // TOKENS</text>
  <text x="422" y="246" fill="#F5F5F7" font-family="sans-serif" font-weight="700" font-size="22">99.98% Sync Precision</text>

  <!-- Right Inspector Panel -->
  <rect x="836" y="178" width="222" height="498" rx="14" fill="#151519" fill-opacity="0.65" stroke="#FFFFFF" stroke-opacity="0.08"/>
  <circle cx="947" cy="296" r="68" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="10"/>
  <path d="M947 228 A68 68 0 1 1 885 324" stroke="#F5F5F7" stroke-width="10" stroke-linecap="round"/>
  <text x="918" y="303" fill="#F5F5F7" font-family="monospace" font-weight="700" font-size="20">84%</text>

  <!-- Bottom Modular Grid -->
  <rect x="390" y="442" width="200" height="234" rx="14" fill="#151519" fill-opacity="0.65" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <rect x="610" y="442" width="200" height="234" rx="14" fill="#151519" fill-opacity="0.65" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <text x="418" y="484" fill="#92929B" font-family="monospace" font-size="11" letter-spacing="2">MODULE 01</text>
  <text x="418" y="516" fill="#F5F5F7" font-family="sans-serif" font-weight="600" font-size="18">Glass Primitives</text>
  <text x="638" y="484" fill="#92929B" font-family="monospace" font-size="11" letter-spacing="2">MODULE 02</text>
  <text x="638" y="516" fill="#F5F5F7" font-family="sans-serif" font-weight="600" font-size="18">Kinetic Motion</text>
</svg>
