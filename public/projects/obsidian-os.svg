<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <radialGradient id="obsGlow" cx="50%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="45%" stop-color="#A1A1AA" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="obsStroke" x1="120" y1="80" x2="1080" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#A1A1AA" stop-opacity="0.24"/>
    </linearGradient>
    <pattern id="obsGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="#050505"/>
  <rect width="1200" height="800" fill="url(#obsGrid)"/>
  <circle cx="600" cy="220" r="520" fill="url(#obsGlow)"/>

  <!-- Main Glass Workspace Window -->
  <rect x="110" y="90" width="980" height="620" rx="20" fill="#0D0D10" fill-opacity="0.9" stroke="url(#obsStroke)" stroke-width="1.5"/>
  <line x1="110" y1="146" x2="1090" y2="146" stroke="#FFFFFF" stroke-opacity="0.1"/>
  <circle cx="146" cy="118" r="5" fill="#F5F5F7" fill-opacity="0.6"/>
  <circle cx="166" cy="118" r="5" fill="#92929B" fill-opacity="0.3"/>
  <circle cx="186" cy="118" r="5" fill="#92929B" fill-opacity="0.3"/>
